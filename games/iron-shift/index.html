<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#192f30"><title>Ca Luyện Thép · Iron Shift</title><link rel="stylesheet" href="style.css"><script defer src="model.js"></script><script defer src="art.js"></script><script defer src="play.js"></script></head>
<body><header><a id="studio" href="../../index.html">Đại Công Trường Xưởng</a><select id="lang" aria-label="Language / Ngôn ngữ"><option value="vi">Tiếng Việt</option><option value="en">English</option></select></header>
<main><div class="mast"><h1 id="title">Ca Luyện Thép</h1><span id="shift"></span></div>
<section class="floor"><div class="drawing"><div id="yard-window"><canvas id="yard" width="1000" height="520" tabindex="0" aria-label="Sân xưởng"></canvas></div><div class="legend"><select id="coordinate" aria-label="Ô / Cell"></select><button id="apply" type="button"></button><span id="legend"></span><button type="button" id="zoom" aria-pressed="false"></button></div></div>
<aside><div class="ticket"><span id="orderLabel"></span><h2 id="order"></h2><div class="quota"><strong id="count"></strong><span id="unit"></span></div><div class="meter"><i id="fill"></i></div><p id="brief"></p></div>
<div class="operation"><button class="power" id="power"></button><button id="speed">1×</button></div><p id="total"></p></aside></section>
<section class="bench"><div class="tools" id="tools"></div><button id="turn"></button></section>
<div class="notes"><p id="help"></p><button id="restart"></button></div><p role="status" id="status"></p>
<dialog id="confirm"><form method="dialog"><p id="prompt"></p><button value="cancel" id="cancel"></button><button value="reset" id="reset"></button></form></dialog></main></body></html>
